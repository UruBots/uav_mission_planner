services:
  mission_planner:
    build:
      context: .
      dockerfile: Dockerfile
    image: mission_planner
    container_name: mission_planner
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ~/.Xauthority:/root/.Xauthority
      - ./config:/etc/config
    env_file:
      - .env
    environment:
      - DISPLAY=$DISPLAY
      - LIBGL_ALWAYS_SOFTWARE=1 
    command: bash -c 'roslaunch mrs_uav_gazebo_simulation simulation.launch world_name:=grass_plane gui:=true'
    # rosservice call /mrs_drone_spawner/spawn "1 --$UAV_TYPE --enable-rangefinder --enable-dual-uv-cameras"'
    # rosservice call /mrs_drone_spawner/spawn "1 2 3 4 5 --f450 --enable-rangefinder --enable-uv-leds --enable-dual-uv-cameras"

    # roslaunch mrs_uav_px4_api api.launch
    # roslaunch mrs_uav_core core.launch platform_config:=`rospack find mrs_multirotor_simulator`/config/mrs_uav_system/$$UAV_TYPE.yaml custom_config:=/etc/config/custom_config.yaml world_config:=/etc/config/world_config.yaml network_config:=/etc/config/network_config.yaml
    # roslaunch mrs_uav_autostart automatic_start.launch custom_config:=/etc/config/automatic_start.yaml
